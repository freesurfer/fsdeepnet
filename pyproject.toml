[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "fsdeepnet"
description = 'Generic deep-learning pytorch pipeline and freesurfer pre-trained models.'
version = "0.1"
dependencies= [
    'annotated-types==0.7.0',
    'certifi==2026.4.22',
    'charset-normalizer==3.4.7',
    'click==8.1.8',
    'eval_type_backport==0.4.0',
    'filelock==3.19.1',
    'fsspec==2025.10.0',
    'gitdb==4.0.12',
    'GitPython==3.1.59',
    'idna==3.14',
    'importlib_resources==6.5.2',
    'Jinja2',
    'MarkupSafe==3.0.3',
    'mpmath==1.3.0',
    'networkx==3.2.1',
    'nibabel==5.3.3',
    'numpy==2.0.0',
    #'nvidia-cublas-cu12==12.4.5.8',
    #'nvidia-cuda-cupti-cu12==12.4.127',
    #'nvidia-cuda-nvrtc-cu12==12.4.127',
    #'nvidia-cuda-runtime-cu12==12.4.127',
    #'nvidia-cudnn-cu12==9.1.0.70',
    #'nvidia-cudnn-cu12==9.3.0.75',
    #'nvidia-cufft-cu12==11.2.1.3',
    #'nvidia-curand-cu12==10.3.5.147',
    #'nvidia-cusolver-cu12==11.6.1.9',
    #'nvidia-cusparse-cu12==12.3.1.170',
    #'nvidia-cusparselt-cu12==0.6.2',
    #'nvidia-nccl-cu12==2.21.5',
    #'nvidia-nvjitlink-cu12==12.4.127',
    #'nvidia-nvtx-cu12==12.4.127',
    'packaging==26.2',
    'pillow==11.3.0',
    'platformdirs==4.4.0',
    'protobuf==5.29.6',
    'psutil==7.2.2',
    'pydantic==2.13.4',
    'pydantic_core==2.46.4',
    'PyYAML==6.0.3',
    'requests==2.32.5',
    'scipy==1.13.1',
    'sentry-sdk==2.67.1',
    'smmap==5.0.3',
    'sympy==1.13.1',
    'torch==2.6.0',
    'torchvision==0.21.0',
    'triton==3.2.0',
    'typing-inspection==0.4.2',
    'typing_extensions==4.15.0',
    'urllib3==2.6.3',
    'wandb==0.26.1',
    'xxhash==3.7.0',
    'zipp==3.23.1',
    'surfa@git+https://github.com/freesurfer/surfa.git@master',
    #'PyQt5',  # for matplotlib
    #'pynvml',
    #'voxynth@git+https://github.com/dalcalab/voxynth.git@main'
]

[project.scripts]
fsdeepnet_train = 'fsdeepnet.cli.fsdeepnet_train:main'
fsdeepnet_predict = 'fsdeepnet.cli.fsdeepnet_predict:main'
fsdeepnet_evaluate = 'fsdeepnet.cli.fsdeepnet_evaluate:main'
fsdeepnet_create_data_list = 'fsdeepnet.cli.fsdeepnet_create_data_list:main'
fsdeepnet_checkpoint = 'fsdeepnet.cli.fsdeepnet_checkpoint:main'
fsdeepnet_test_dataset = 'fsdeepnet.cli.test_dataset:main'
fsdeepnet_test_dataloader = 'fsdeepnet.cli.test_dataloader:main'
fsdeepnet_tf2torch = 'fsdeepnet.cli.tf2torch.loadh5_synthseg:main'
