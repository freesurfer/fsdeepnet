[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "fsdeepnet"
description = 'Generic deep-learning pytorch pipeline and freesurfer pre-trained models.'
version = "0.1"
dependencies= [
    'torch>=2.2.2',
    'torchvision',
    'h5py',
    'psutil',
    'wandb',
    'surfa @ https://github.com/jnolan14/surfa/releases/download/v0.7.0rc4/surfa-0.7.0.tar.gz#sha256=9adbd75c17ee5970bf68bf25927b2bd45fd0a29fcb3dd5f7fe7cc243e5347213'
    #'surfa@git+https://github.com/freesurfer/surfa.git@master',
    #'PyQt5',  # for matplotlib
    #'pynvml',
    #'voxynth@git+https://github.com/dalcalab/voxynth.git@main'
]

[project.scripts]
fsdeepnet_train = 'fsdeepnet.cli.fsdeepnet_train:main'
fsdeepnet_predict = 'fsdeepnet.cli.fsdeepnet_predict:main'
fsdeepnet_evaluate = 'fsdeepnet.cli.fsdeepnet_evaluate:main'
fsdeepnet_create_data_list = 'fsdeepnet.cli.fsdeepnet_create_data_list:main'
fsdeepnet_checkpoint = 'fsdeepnet.cli.fsdeepnet_checkpoint:main'
fsdeepnet_test_dataset = 'fsdeepnet.cli.test_dataset:main'
fsdeepnet_test_dataloader = 'fsdeepnet.cli.test_dataloader:main'
fsdeepnet_tf2torch = 'fsdeepnet.cli.fsdeepnet_tf2torch:main'
